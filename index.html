<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Risk Quantifier — from a 5×5 matrix to a loss distribution</title>
  <meta name="description" content="Place up to five risks on a likelihood-by-impact matrix, give each the frequency and loss range its cell was standing in for, run ten thousand simulated years, and compare what the colour said with what the distribution shows. A RootCaws LLC risk lab tool." />
  <meta name="author" content="RootCaws LLC" />
  <meta name="robots" content="index, follow" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Risk Quantifier" />
  <meta property="og:description" content="From a five-by-five matrix to a loss distribution in dollars, one risk at a time." />
  <meta property="og:site_name" content="RootCaws LLC · Risk Lab" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root{
      color-scheme:light;
      --paper:#f7ebed;--paper-2:#f0dee0;--panel:#ffffff;
      --ink:#3a3336;--ink-2:#4d4548;--muted:#7a7073;
      --line:#d8c9cc;--soft-line:rgba(58,51,54,.08);
      --rose:#8d5860;--rose-2:#c7848d;--rose-soft:#f4dcdf;
      --sage:#4c7359;--sage-soft:#e2eee6;
      --amber:#9a6a24;--amber-soft:#f7e9d4;
      --plum:#6f5b86;--plum-soft:#ece7f2;
      --steel:#4a6b8a;
      --ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --display:'Fraunces',Georgia,serif;
      --shadow:0 10px 26px rgba(58,51,54,.07);
      --radius:14px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:var(--paper);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-width:320px;line-height:1.5}
    ::selection{background:var(--rose-soft)}
    a{color:var(--rose)}
    button,input,select{font:inherit;color:inherit}
    :focus-visible{outline:2px solid var(--rose);outline-offset:2px;border-radius:4px}
    .wrap{max-width:1400px;margin:0 auto;padding:0 24px}
    @media (max-width:767px){.wrap{padding:0 16px}}

    .masthead{padding-top:48px;padding-bottom:28px;border-bottom:1px solid var(--soft-line)}
    .kicker{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
    .masthead h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,4.6vw,56px);line-height:1.02;letter-spacing:-.02em;margin:10px 0 14px}
    .masthead h1 em{font-style:italic;color:var(--rose)}
    .deck{font-size:17px;color:var(--ink-2);line-height:1.6}

    .bench{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:20px;align-items:start;padding-top:24px}
    @media (max-width:899px){.bench{grid-template-columns:1fr}}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .controls{position:sticky;top:16px;padding:18px}
    @media (max-width:899px){.controls{position:static}}
    .label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    .label-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
    .label-row .unit{font-size:11px;color:var(--muted)}
    .rule{height:1px;background:var(--soft-line);margin:16px 0}
    .hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}
    .warn{font-size:12px;color:var(--amber);line-height:1.5;margin-top:6px}
    .btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--rose);background:var(--rose);color:#fff;transition:background .12s,border-color .12s,color .12s;white-space:nowrap}
    .btn:hover{background:var(--ink);border-color:var(--ink)}
    .btn.ghost{background:transparent;color:var(--rose)}
    .btn.ghost:hover{background:var(--rose-soft);border-color:var(--rose);color:var(--rose)}
    .btn.small{padding:6px 12px;font-size:12px}
    .foot-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .foot-row .meta{font-size:11.5px;color:var(--muted);line-height:1.45}
    select.field,input.field{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;color:var(--ink)}
    input.field{font-variant-numeric:tabular-nums}
    input.field:focus,select.field:focus{border-color:var(--rose);outline:none}
    .triple{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .triple .sub{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}

    /* the matrix */
    .matrix{display:grid;grid-template-columns:auto repeat(5,1fr);gap:4px;align-items:stretch}
    .matrix .ax{font-size:9.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;padding:2px}
    .matrix .ax.y{justify-content:flex-end;padding-right:6px;text-align:right;max-width:76px}
    .cell{position:relative;aspect-ratio:1/1;border-radius:8px;border:1px solid transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s,border-color .12s}
    .cell:hover{transform:scale(1.04);border-color:var(--ink)}
    .cell.low{background:var(--sage-soft)}
    .cell.mid{background:var(--amber-soft)}
    .cell.high{background:var(--rose-soft)}
    .cell.full{cursor:not-allowed;opacity:.55}
    .cell.full:hover{transform:none;border-color:transparent}
    .pin{width:26px;height:26px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(58,51,54,.25)}
    .axis-title{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:8px}
    .keys{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
    .keys span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
    .keys i{width:12px;height:12px;border-radius:3px;display:inline-block}

    .panel{padding:16px 18px 16px;margin-bottom:16px}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
    .panel-head h2{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em}
    .panel-head .tag{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
    .lede{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin-bottom:12px}
    .empty{font-size:13px;color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:10px;text-align:center}

    .risk{border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--panel)}
    .risk-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
    .risk-head .pin{width:24px;height:24px;font-size:11.5px}
    .risk-head b{font-size:14px}
    .risk-head .cellname{font-size:12.5px;color:var(--muted)}
    .risk-head .x{margin-left:auto;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px}
    .risk-head .x:hover{color:var(--rose)}
    .risk-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
    @media (max-width:640px){.risk-grid{grid-template-columns:1fr}}
    .source{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
    .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
    .badge{font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink-2)}
    .badge.ccy{background:var(--rose-soft);border-color:transparent;color:var(--rose)}
    .caveat{font-size:12.5px;line-height:1.55;color:var(--ink-2);padding:8px 10px;border-radius:8px;background:var(--amber-soft);border-left:3px solid var(--amber)}
    .caveat strong{color:var(--amber)}
    details.sources{margin-top:8px}
    details.sources summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);font-weight:600}
    details.sources ul{margin:8px 0 0 16px}
    details.sources li{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:8px}
    details.sources code{font-family:var(--ui);font-size:11px;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--ink-2)}

    .compare{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--paper);margin-bottom:12px}
    @media (max-width:640px){.compare{grid-template-columns:1fr}}
    .compare .side b{display:block;font-family:var(--display);font-size:24px;font-weight:600;line-height:1.05}
    .compare .side span{display:block;font-size:12px;color:var(--muted);line-height:1.45;margin-top:3px}
    .compare .arrow{font-size:20px;color:var(--rose)}
    table.ledger{width:100%;border-collapse:collapse}
    table.ledger th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px 8px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
    table.ledger td{padding:8px;border-bottom:1px solid var(--soft-line);font-size:13px;vertical-align:middle}
    table.ledger th.num,table.ledger td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
    table.ledger td.who{white-space:nowrap}
    table.ledger td.who .pin{display:inline-flex;width:22px;height:22px;font-size:11px;margin-right:8px;vertical-align:middle}
    table.ledger td.who small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
    table.ledger tr.total td{border-top:2px solid var(--line);font-weight:600;background:var(--paper)}
    table.ledger td.spark{min-width:150px}
    table.ledger td.spark svg{display:block;width:100%;height:auto}
    .mixed{font-size:12.5px;color:var(--ink-2);line-height:1.55;padding:10px 12px;border-radius:8px;background:var(--amber-soft);border-left:3px solid var(--amber);margin-top:10px}
    .ledger-wrap{overflow-x:auto}

    .notes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-top:28px;padding-bottom:80px}
    .notes::before{content:"Notes";grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--soft-line)}
    .note{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px}
    @media (max-width:899px){.notes{grid-template-columns:1fr}}
    .note h3{font-family:var(--display);font-weight:600;font-size:19px;margin-bottom:8px;letter-spacing:-.01em}
    .note p{font-size:14px;color:var(--ink-2);line-height:1.65}
    .notes.embedded{padding-top:8px}
    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.cell:hover{transform:none}}
  </style>
</head>

  // ---------------------------------------------------------------- format
  function symbolFor(ccy){return SYMBOL[ccy]||(ccy+" ");}
  function money(v,ccy){
    const s=symbolFor(ccy);
    if(!(v>0))return s+"0";
    if(v>=1e9)return s+(v/1e9).toFixed(1)+"B";
    if(v>=1e6)return s+(v/1e6).toFixed(1)+"M";
    if(v>=1e3)return s+Math.round(v/1e3)+"K";
    return s+Math.round(v);
  }
  function pct(p){const v=p*100;return v===0?"0%":v>=10?Math.round(v)+"%":v>=1?v.toFixed(1)+"%":v.toFixed(2)+"%";}
  function parseAmount(text){
    if(text==null)return NaN;
    const t=String(text).toUpperCase().replace(/[^0-9.KMB]/g,"");
    const m=t.match(/^([0-9]*\.?[0-9]+)([KMB]?)$/);
    if(!m)return NaN;
    return parseFloat(m[1])*({K:1e3,M:1e6,B:1e9,"":1})[m[2]];
  }
  function plain(n){return Number.isInteger(n)?String(n):String(+n.toPrecision(4));}

  // -------------------------------------------------------------- sampling
  // A PERT draw for the annual rate, a Poisson count of events at that rate,
  // and an independent PERT loss per event, summed. A year with three events
  // is three separate losses added together, not one loss tripled.
  function randn(){let u=0,v=0;while(u===0)u=Math.random();while(v===0)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
  function gamma(shape){
    if(shape<1)return gamma(shape+1)*Math.pow(Math.random(),1/shape);
    const d=shape-1/3,c=1/Math.sqrt(9*d);
    for(;;){let x,v;do{x=randn();v=1+c*x;}while(v<=0);v=v*v*v;const u=Math.random();
      if(u<1-0.0331*x*x*x*x)return d*v;
      if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;}
  }
  function pert(lo,ml,hi){const span=hi-lo;if(!(span>0))return ml;const a=1+4*(ml-lo)/span,b=1+4*(hi-ml)/span;const x=gamma(a),y=gamma(b);return lo+span*(x/(x+y));}
  function poisson(rate){if(!(rate>0))return 0;if(rate>=40)return Math.max(0,Math.round(rate+Math.sqrt(rate)*randn()));const L=Math.exp(-rate);let k=0,p=Math.random();while(p>L){k++;p*=Math.random();}return k;}
  function ordered(t){return t.slice().sort((a,b)=>a-b);}
  function isOrdered(t){return t[0]<=t[1]&&t[1]<=t[2];}

  function simulateRaw(freq,sev,years){
    const f=ordered(freq),s=ordered(sev),out=new Float64Array(years);
    for(let y=0;y<years;y++){
      const events=poisson(pert(f[0],f[1],f[2]));
      let t=0;for(let e=0;e<events;e++)t+=pert(s[0],s[1],s[2]);
      out[y]=t;
    }
    return out;
  }
  function summarise(raw){
    const sorted=Float64Array.from(raw).sort();
    const n=sorted.length;
    let sum=0,zeros=0;for(let i=0;i<n;i++){sum+=sorted[i];if(sorted[i]===0)zeros++;}
    const q=p=>sorted[Math.min(n-1,Math.floor(p*n))];
    return {sorted,n,mean:sum/n,p50:q(0.5),p90:q(0.9),zeroShare:zeros/n};
  }

      el('div',{className:"risk-grid"},
        el(Triple,{title:"Frequency",unit:"events per year",values:risk.freq,onChange:v=>onChange(Object.assign({},risk,{freq:v}))}),
        el(Triple,{title:"Loss per event",unit:risk.ccy,values:risk.sev,onChange:v=>onChange(Object.assign({},risk,{sev:v})),isMoney:true,ccy:risk.ccy})),
      bm&&el(SourceCard,{bm}));
  }

  // ----------------------------------------------------------------- ledger
  function Spark({sum,color}){
    const w=160,h=44,nb=30;
    const vals=[];for(let i=0;i<sum.n;i++)if(sum.sorted[i]>0)vals.push(sum.sorted[i]);
    if(vals.length<2)return el('svg',{viewBox:"0 0 "+w+" "+h,role:"img","aria-label":"no loss years to draw"},el('text',{x:w/2,y:h/2+4,textAnchor:"middle",fontSize:10,fill:"var(--muted)"},"no loss in most years"));
    const lo=vals[0],hi=vals[vals.length-1],bw=(hi-lo)/nb||1,bins=new Array(nb).fill(0);
    for(const v of vals)bins[Math.min(nb-1,Math.floor((v-lo)/bw))]++;
    const top=Math.max(...bins);
    return el('svg',{viewBox:"0 0 "+w+" "+h,role:"img","aria-label":"distribution of annual loss"},
      bins.map((c,i)=>c?el('rect',{key:i,x:i*(w/nb)+0.5,y:h-4-(c/top)*(h-6),width:w/nb-1,height:(c/top)*(h-6),fill:color,opacity:0.8,rx:1}):null),
      el('line',{x1:0,x2:w,y1:h-3.5,y2:h-3.5,stroke:"var(--line)"}));
  }

  function Ledger({risks,results,total,mixed}){
    const colours=new Set(risks.map(r=>heatOf(r.row,r.col))).size;
    const ccys=Array.from(new Set(risks.map(r=>r.ccy)));
    return el('div',null,
      el('div',{className:"compare"},
        el('div',{className:"side"},el('b',null,risks.length+(risks.length===1?" cell":" cells")+", "+colours+(colours===1?" colour":" colours")),el('span',null,"That is everything the matrix can say: a position, and a tint shared with every other risk in the same band.")),
        el('div',{className:"arrow","aria-hidden":"true"},"→"),
        el('div',{className:"side"},el('b',null,risks.length+(risks.length===1?" distribution":" distributions")+(total?" and a total":"")),el('span',null,"Each with a median, an average and a bad year in "+ccys.join(" and ")+", read off ten thousand simulated years."))),
      el('div',{className:"ledger-wrap"},el('table',{className:"ledger"},
        el('thead',null,el('tr',null,el('th',null,"Risk"),el('th',null,"Ten thousand years"),el('th',{className:"num"},"Typical year"),el('th',{className:"num"},"Average"),el('th',{className:"num"},"Bad year (1 in 10)"),el('th',{className:"num"},"Loss-free years"))),
        el('tbody',null,
          risks.map((r,i)=>{const s=results[i],c=RISK_COLORS[r.num-1];
            return el('tr',{key:r.id},
              el('td',{className:"who"},el('span',{className:"pin",style:{background:c}},r.num),el('span',null,ROWS[r.row]+" × "+COLS[r.col]),el('small',null,heatOf(r.row,r.col)==="mid"?"medium":heatOf(r.row,r.col)," on the matrix")),
              el('td',{className:"spark"},el(Spark,{sum:s,color:c})),
              el('td',{className:"num"},s.p50>0?money(s.p50,r.ccy):"no loss"),
              el('td',{className:"num"},money(s.mean,r.ccy)),
              el('td',{className:"num"},money(s.p90,r.ccy)),
              el('td',{className:"num"},pct(s.zeroShare)));}),
          total&&el('tr',{className:"total"},
            el('td',{className:"who"},el('span',{className:"pin",style:{background:"var(--ink)"}},"Σ"),el('span',null,"All "+risks.length+" together"),el('small',null,"summed year by year, then sorted")),
            el('td',{className:"spark"},el(Spark,{sum:total,color:"#3a3336"})),
            el('td',{className:"num"},total.p50>0?money(total.p50,ccys[0]):"no loss"),
            el('td',{className:"num"},money(total.mean,ccys[0])),
            el('td',{className:"num"},money(total.p90,ccys[0])),
            el('td',{className:"num"},pct(total.zeroShare)))))),
      mixed&&el('div',{className:"mixed"},el('strong',null,"No total. "),"These risks are priced in different currencies, and adding them without a stated exchange rate and date would produce a figure that looks precise and is not."));
  }

  // ----------------------------------------------------------------- notes
  function Notes(){
    return el('section',{className:"wrap notes"+(EMBEDDED?" embedded":""),"aria-label":"Notes"},
      el('div',{className:"note"},el('h3',null,"What a cell cannot hold"),
        el('p',null,"Two risks in the same square are treated as the same risk, even when one costs fifty thousand and the other five million. And because a colour has no units, nothing can be done with it: you cannot add two cells, compare a cell to a budget, or say what a control that moves a risk one column to the left is worth.")),
      el('div',{className:"note"},el('h3',null,"Where the starting ranges come from"),
        el('p',null,"Every cell carries an illustrative frequency and loss range so that placing a risk gives the model something to run. They are teaching values, not data. The benchmark picker replaces them with ranges that cite a public source for every parameter, together with that source's own limits, which is the difference between a number and a number you can defend.")),
      el('div',{className:"note"},el('h3',null,"Why the total is summed by year"),
        el('p',null,"The portfolio row adds each simulated year across risks before anything is sorted, because a bad year for one risk is not necessarily a bad year for another. Adding the individual bad-year figures instead would overstate the total. The version here assumes the risks are independent; real ones often are not, and correlation is where a production model earns its keep.")));
  }

  // ------------------------------------------------------------------- app
  function App(){
    const narrow=useNarrow(900);
    const [risks,setRisks]=useState([]);
    const [tick,setTick]=useState(0);
    const [seq,setSeq]=useState(0);

    function toggleCell(row,col){
      setRisks(rs=>{
        const idx=rs.findIndex(r=>r.row===row&&r.col===col);
        if(idx>=0)return rs.filter((_,i)=>i!==idx);
        if(rs.length>=MAX_RISKS)return rs;
        const used=new Set(rs.map(r=>r.num));
        let num=1;while(used.has(num))num++;
        setSeq(s=>s+1);
        return rs.concat([{id:"r"+Date.now()+"-"+seq,num,row,col,freq:FREQ_BY_ROW[row].slice(),sev:SEV_BY_COL[col].slice(),ccy:"USD",bmId:""}]);
      });
    }
    function replace(next){setRisks(rs=>rs.map(r=>r.id===next.id?next:r));}
    function remove(id){setRisks(rs=>rs.filter(r=>r.id!==id));}

    const sim=useMemo(()=>{
      const raws=risks.map(r=>simulateRaw(r.freq,r.sev,YEARS));
      const results=raws.map(summarise);
      const ccys=new Set(risks.map(r=>r.ccy));
      let total=null;
      if(risks.length>1&&ccys.size===1){
        const sum=new Float64Array(YEARS);
        for(const raw of raws)for(let i=0;i<YEARS;i++)sum[i]+=raw[i];
        total=summarise(sum);
      }
      return {results,total,mixed:ccys.size>1};
    },[risks,tick]);

    return el('div',null,
      !EMBEDDED&&el('header',{className:"wrap masthead"},
        el('div',{className:"kicker"},"RootCaws · Risk lab"),
        el('h1',null,"Risk ",el('em',null,"Quantifier")),
        el('p',{className:"deck"},"Start where most registers start, on a five-by-five matrix. Give each placed risk the frequency and loss range its cell was standing in for, run ten thousand simulated years, and compare what the colour told you with what the distribution does.")),
      el('div',{className:"wrap bench"},
        el('aside',{className:"card controls","aria-label":"Matrix"},
          el('div',{className:"label-row"},el('span',{className:"label"},"The matrix"),el('span',{className:"unit"},"tap a cell to place, tap again to remove")),
          el(Matrix,{risks,onCell:toggleCell}),
          el('div',{className:"rule"}),
          el('div',{className:"foot-row"},
            el('div',{className:"meta"},YEARS.toLocaleString()+" simulated years per risk,",el('br'),"recomputed on every change."),
            el('div',{style:{display:"flex",gap:6}},
              risks.length>0&&el('button',{type:"button",className:"btn ghost small",onClick:()=>setRisks([])},"Clear"),
              el('button',{type:"button",className:"btn ghost small",onClick:()=>setTick(t=>t+1),disabled:!risks.length},"Resample")))),
        el('section',{"aria-label":"Risks and results"},
          el('div',{className:"card panel"},
            el('div',{className:"panel-head"},el('h2',null,"What each cell was standing in for"),el('span',{className:"tag"},risks.length?risks.length+" placed":"nothing placed")),
            el('p',{className:"lede"},"Every placed risk gets a frequency in events per year and a loss per event, each as a low, likely and high. The cell fills them with illustrative values; a benchmark replaces them with ranges that cite their sources."),
            risks.length===0
              ?el('div',{className:"empty"},"Place a risk on the matrix to begin.")
              :risks.map(r=>el(RiskCard,{key:r.id,risk:r,onChange:replace,onRemove:()=>remove(r.id)}))),
          risks.length>0&&el('div',{className:"card panel"},
            el('div',{className:"panel-head"},el('h2',null,"What the matrix said, and what the model says"),el('span',{className:"tag"},"live")),
            el(Ledger,{risks,results:sim.results,total:sim.total,mixed:sim.mixed})))),
      el(Notes));
  }

  ReactDOM.createRoot(document.getElementById('root')).render(el(App));
  </script>
</body>
</html>
